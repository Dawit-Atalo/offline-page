<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>No Internet - UEE MASTER</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;
}

body{
height:100vh;
overflow:hidden;
display:flex;
justify-content:center;
align-items:center;
background:linear-gradient(135deg,#030712,#0f172a,#111827);
position:relative;
}

/* Animated Background */
body::before{
content:"";
position:absolute;
width:500px;
height:500px;
background:#2563eb;
border-radius:50%;
filter:blur(180px);
opacity:.25;
top:-200px;
left:-200px;
animation:float1 8s infinite alternate;
}

body::after{
content:"";
position:absolute;
width:450px;
height:450px;
background:#ef4444;
border-radius:50%;
filter:blur(180px);
opacity:.15;
bottom:-200px;
right:-200px;
animation:float2 8s infinite alternate;
}

@keyframes float1{
from{transform:translateY(0);}
to{transform:translateY(80px);}
}

@keyframes float2{
from{transform:translateY(0);}
to{transform:translateY(-80px);}
}

/* Floating Particles */
.particle{
position:absolute;
width:6px;
height:6px;
background:rgba(255,255,255,.3);
border-radius:50%;
animation:particles 10s linear infinite;
}

@keyframes particles{
0%{
transform:translateY(100vh);
opacity:0;
}
20%{
opacity:1;
}
100%{
transform:translateY(-100px);
opacity:0;
}
}

.container{
width:90%;
max-width:520px;
padding:45px 30px;
text-align:center;

background:rgba(255,255,255,.05);
border:1px solid rgba(255,255,255,.08);

backdrop-filter:blur(20px);
-webkit-backdrop-filter:blur(20px);

border-radius:32px;

box-shadow:
0 0 40px rgba(0,0,0,.5),
0 0 80px rgba(37,99,235,.15);

z-index:10;
}

.logo{
font-size:28px;
font-weight:800;
letter-spacing:2px;
background:linear-gradient(90deg,#60a5fa,#ffffff);
-webkit-background-clip:text;
-webkit-text-fill-color:transparent;
margin-bottom:10px;
}

.tagline{
color:#94a3b8;
font-size:13px;
margin-bottom:30px;
}

.icon-wrapper{
width:150px;
height:150px;
margin:auto;

border-radius:50%;

display:flex;
justify-content:center;
align-items:center;

background:rgba(255,255,255,.05);

border:1px solid rgba(255,255,255,.08);

box-shadow:
0 0 40px rgba(239,68,68,.25);

animation:pulse 2s infinite;
}

@keyframes pulse{
0%{transform:scale(1);}
50%{transform:scale(1.05);}
100%{transform:scale(1);}
}

.icon{
font-size:75px;
}

h1{
color:white;
margin-top:25px;
font-size:38px;
font-weight:700;
}

.description{
margin-top:12px;
color:#cbd5e1;
line-height:1.8;
font-size:15px;
}

.status-card{
margin-top:30px;

padding:18px;

border-radius:18px;

background:rgba(255,255,255,.04);
border:1px solid rgba(255,255,255,.08);

text-align:left;
}

.status-row{
display:flex;
justify-content:space-between;
margin:10px 0;
color:#dbeafe;
font-size:14px;
}

.offline{
color:#ff6b6b;
font-weight:600;
}

.online-dot{
width:10px;
height:10px;
border-radius:50%;
background:#ff4d4d;
display:inline-block;
margin-right:6px;
animation:blink 1.2s infinite;
}

@keyframes blink{
50%{
opacity:.2;
}
}

.retry-btn{
margin-top:30px;
width:100%;

padding:16px;

border:none;
border-radius:50px;

font-size:16px;
font-weight:600;

cursor:pointer;
color:white;

background:linear-gradient(
135deg,
#2563eb,
#60a5fa
);

box-shadow:
0 10px 30px rgba(37,99,235,.4);

transition:.3s;
}

.retry-btn:hover{
transform:translateY(-3px);
}

.footer{
margin-top:20px;
font-size:12px;
color:#64748b;
}

</style>
</head>

<body>

<div class="particle" style="left:10%;animation-delay:0s;"></div>
<div class="particle" style="left:25%;animation-delay:2s;"></div>
<div class="particle" style="left:40%;animation-delay:4s;"></div>
<div class="particle" style="left:60%;animation-delay:1s;"></div>
<div class="particle" style="left:80%;animation-delay:3s;"></div>

<div class="container">

<div class="logo">
UEE MASTER
</div>

<div class="tagline">
Your Ultimate Entrance Exam Companion
</div>

<div class="icon-wrapper">
<div class="icon">📡❌</div>
</div>

<h1>No Internet</h1>

<div class="description">
We couldn't connect to the internet.<br>
Please check your Wi-Fi or mobile data connection and try again.
</div>

<div class="status-card">

<div class="status-row">
<span>Status</span>
<span class="offline">
<span class="online-dot"></span>
Offline
</span>
</div>

<div class="status-row">
<span>Network</span>
<span>Not Available</span>
</div>

<div class="status-row">
<span>Server</span>
<span>Disconnected</span>
</div>

</div>

<button class="retry-btn" onclick="location.reload()">
🔄 Reconnect Now
</button>

<div class="footer">
Powered by UEE MASTER
</div>

</div>

<script>

/* Auto Retry Every 5 Seconds */
setInterval(() => {
if(navigator.onLine){
location.reload();
}
},5000);

/* Network Change Listener */
window.addEventListener("online",()=>{
location.reload();
});

</script>

</body>
</html>
